# A managed Postgres database so uploaded documents/deals survive redeploys —
# the web service's local disk (and a plain SQLite file on it) does not.
databases:
  - name: deal-sourcing-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: deal-sourcing-agent
    runtime: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deal-sourcing-db
          property: connectionString
