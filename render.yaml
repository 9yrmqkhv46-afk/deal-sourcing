services:
  - type: web
    name: deal-sourcing-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      # --- Live ingestion, scheduling & persistence ---
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SYNC_TIMES
        value: "03:00,03:15,03:30,03:45"
      - key: DATABASE_PATH
        value: ./data/deal_sourcing.db
      # Credential-gated connectors (leave unset to keep live ingestion idle).
      # Set real values in the Render dashboard's Environment tab.
      #
      # A SINGLE APIFY_TOKEN drives the entire 22-actor Apify ACTOR_REGISTRY
      # (app/actors.py): the daily scheduler and POST /api/sync run every actor
      # via run-sync-get-dataset-items and store a live_sync snapshot that the
      # live endpoints serve. Per-actor input payloads can be overridden with
      # APIFY_ACTOR_INPUT_<SOURCE_KEY> (a JSON object). These are third-party
      # Apify actors run under the operator's own Apify account/usage.
      - key: APIFY_TOKEN
        sync: false
      # Optional per-actor run timeout (seconds) for run-sync-get-dataset-items.
      - key: APIFY_ACTOR_TIMEOUT
        sync: false
      # Shared DEFAULT actor: a single uploaded Apify actor that drives ANY
      # source lacking its own dedicated APIFY_ACTOR_<SOURCE> below. Set either
      # APIFY_DEFAULT_ACTOR (preferred) or APIFY_ACTOR and every source becomes
      # live once APIFY_TOKEN is also set. Per-source actors still take priority.
      - key: APIFY_DEFAULT_ACTOR
        sync: false
      - key: APIFY_ACTOR
        sync: false
      # Per-source Apify actor ids. One APIFY_ACTOR_<SOURCE> per registered
      # source; declared here (sync:false) so they appear in Render's dashboard
      # ready to fill in. A source stays idle until APIFY_TOKEN + an actor id
      # (its own or the shared default above) are both set.
      - key: APIFY_ACTOR_BUSINESSFORSALE_AU
        sync: false
      - key: APIFY_ACTOR_BSALE
        sync: false
      - key: APIFY_ACTOR_ANYBUSINESS
        sync: false
      - key: APIFY_ACTOR_ALLBUSINESS_AU
        sync: false
      - key: APIFY_ACTOR_LINK_BUSINESS
        sync: false
      - key: APIFY_ACTOR_SBX_BUSINESS
        sync: false
      - key: APIFY_ACTOR_RESOLVE
        sync: false
      - key: APIFY_ACTOR_BENCHMARK_BUSINESS
        sync: false
      - key: APIFY_ACTOR_BUSINESSESFORSALE_AU
        sync: false
      - key: APIFY_ACTOR_FRANCHISE2SELL
        sync: false
      - key: APIFY_ACTOR_SCALING
        sync: false
      - key: APIFY_ACTOR_SCALINGUP_COM_AU
        sync: false
      - key: LINKEDIN_INGEST_ENABLED
        value: "false"
      - key: LINKEDIN_API_TOKEN
        sync: false
      - key: APIFY_ACTOR_LINKEDIN
        sync: false
      - key: FACEBOOK_INGEST_ENABLED
        value: "false"
      - key: FACEBOOK_API_TOKEN
        sync: false
      - key: FACEBOOK_GROUP_IDS
        sync: false
      - key: APIFY_ACTOR_FACEBOOK_GROUPS
        sync: false
